apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-ray
  namespace: stateful-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-ray
  template:
    metadata:
      labels:
        app: jupyter-ray
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: jupyter
          image: rayproject/ray:2.40.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== Starting Jupyter setup ==="

              echo "=== Installing Homebrew dependencies ==="
              apt-get update && apt-get install -y curl git build-essential procps file
              echo "=== Homebrew dependencies installed ==="

              echo "=== Setting up Homebrew in persistent storage ==="
              export HOMEBREW_PREFIX="/home/jovyan/.homebrew"

              if [ ! -d "$HOMEBREW_PREFIX" ]; then
                echo "=== Installing Homebrew for ray user to persistent storage ==="
                mkdir -p "$HOMEBREW_PREFIX"
                chown -R ray "$HOMEBREW_PREFIX"
                su - ray -c "export HOMEBREW_PREFIX=$HOMEBREW_PREFIX && NONINTERACTIVE=1 /bin/bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\""
                echo "=== Homebrew installation complete ==="
              else
                echo "=== Homebrew already installed, skipping ==="
              fi

              echo "=== Adding Homebrew to ray user PATH ==="
              su - ray -c "echo 'export HOMEBREW_PREFIX=$HOMEBREW_PREFIX' >> /home/ray/.bashrc"
              su - ray -c "echo 'eval \"\$($HOMEBREW_PREFIX/bin/brew shellenv)\"' >> /home/ray/.bashrc"
              echo "=== Homebrew configured ==="

              echo "=== Verifying brew installation ==="
              su - ray -c "$HOMEBREW_PREFIX/bin/brew --version" || echo "Brew not found!"

              echo "=== Installing Jupyter Lab ==="
              pip install jupyterlab

              echo "=== Setting up directories with correct ownership ==="
              mkdir -p /home/jovyan/notebook-123
              mkdir -p /home/ray/.local
              chown -R ray /home/ray/.local /home/jovyan
              echo "=== Directories ready ==="

              echo "=== Starting Jupyter Lab ==="
              export PATH="/home/jovyan/.homebrew/bin:/home/jovyan/.homebrew/sbin:$PATH"
              jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' --notebook-dir=/home/jovyan/notebook-123
          ports:
            - containerPort: 8888
              name: jupyter
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: RAY_ADDRESS
              value: "ray://raycluster-sample-head-svc.ray-system.svc.cluster.local:10001"
            - name: HOMEBREW_PREFIX
              value: "/home/jovyan/.homebrew"
          volumeMounts:
            - name: notebooks
              mountPath: /home/jovyan
      volumes:
        - name: notebooks
          persistentVolumeClaim:
            claimName: jupyter-notebooks
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-notebooks
  namespace: stateful-apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: openebs-hostpath
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-ray
  namespace: stateful-apps
spec:
  selector:
    app: jupyter-ray
  ports:
    - port: 8888
      targetPort: 8888
      name: jupyter
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jupyter-ray-netpol
  namespace: stateful-apps
spec:
  podSelector:
    matchLabels:
      app: jupyter-ray
  policyTypes:
    - Egress
  egress:
    # Allow all egress for pip installs and cross-namespace Ray connections
    - {}
