---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prefect-db
  namespace: prefect
  labels:
    app: prefect-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
  namespace: prefect
  labels:
    app: prefect-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
    spec:
      containers:
        - name: prefect-server
          image: prefecthq/prefect:3-python3.11
          command: ["prefect", "server", "start"]
          ports:
            - name: api
              containerPort: 4200
              protocol: TCP
          env:
            - name: PREFECT_SERVER_API_HOST
              value: "0.0.0.0"
            - name: PREFECT_SERVER_API_PORT
              value: "4200"
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: "sqlite+aiosqlite:////var/lib/prefect/prefect.db"
            - name: PREFECT_API_URL
              # port forward this at the momnet, so use localhost here
              value: "http://localhost:4200/api"
              # value: "http://prefect-server.prefect:4200/api"
          volumeMounts:
            - name: prefect-data
              mountPath: /var/lib/prefect
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: prefect-data
          persistentVolumeClaim:
            claimName: prefect-db
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
  namespace: prefect
  labels:
    app: prefect-server
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 4200
      targetPort: 4200
      protocol: TCP
  selector:
    app: prefect-server
