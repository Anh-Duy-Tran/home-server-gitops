[project]
name = "voice-assistant"
version = "0.1.0"
description = "Local voice assistant for Home Assistant with wake word detection and Vosk STT"
authors = [
    { name = "Duy Tran", email = "duy@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6.1,<2.0.0",
    "sounddevice>=0.4.6,<0.5.0",
    "vosk>=0.3.45,<0.4.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
voice-agent = "voice_assistant.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
