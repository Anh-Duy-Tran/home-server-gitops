apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voice-assistant

resources:
  - namespace.yaml
  - mqtt-broker.yaml
  - voice-agent.yaml

labels:
  - pairs:
      app.kubernetes.io/name: voice-assistant
      app.kubernetes.io/component: voice-control
      app.kubernetes.io/managed-by: argocd
    includeSelectors: true
    includeTemplates: true
