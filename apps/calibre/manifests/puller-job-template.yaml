apiVersion: batch/v1
kind: Job
metadata:
  name: calibre-puller
  namespace: calibre
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre
        app.kubernetes.io/component: puller
    spec:
      restartPolicy: OnFailure
      containers:
      - name: calibre-puller
        image: ghcr.io/anh-duy-tran/calibre-puller:latest
        env:
        - name: REMOTE_OPDS_URL
          value: "CHANGEME"  # REQUIRED: Set this to your OPDS feed URL
        - name: MAX_BOOKS
          value: "1"  # REQUIRED: Must be > 0
        - name: FORMATS
          value: "epub"  # Optional: comma-separated list (epub,mobi,pdf)
        - name: FILTER_GENRE
          value: ""  # Optional: Not implemented in PoC
        - name: LIBRARY_PATH
          value: "/data/calibre-library"
        - name: DRY_RUN
          value: "0"  # Set to "1" for preview mode
        volumeMounts:
        - name: calibre-library
          mountPath: /data/calibre-library
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: calibre-library
        persistentVolumeClaim:
          claimName: calibre-library-pvc
