apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgres

resources:
  - namespace.yaml
  - postgres-deployment.yaml

images:
  - name: postgres
    newTag: "16-alpine"

replicas:
  - name: postgres
    count: 1

commonLabels:
  app.kubernetes.io/part-of: postgres
  managed-by: argocd
