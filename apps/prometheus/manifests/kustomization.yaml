apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=configs/prometheus.yml
  - name: grafana-datasources
    files:
      - datasources.yaml=configs/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yaml=configs/dashboard-provider.yaml
  - name: grafana-dashboards
    files:
      - ray-cluster.json=configs/dashboards/ray-cluster.json
      - k8s-cluster.json=configs/dashboards/k8s-cluster.json
      - traefik.json=configs/dashboards/traefik.json

secretGenerator:
  - name: grafana-admin
    literals:
      - admin-user=admin
      - admin-password=admin # Change this!

images:
  - name: prom/prometheus
    newTag: v2.54.1
  - name: grafana/grafana
    newTag: "11.3.0"

replicas:
  - name: prometheus
    count: 1
  - name: grafana
    count: 1

commonLabels:
  app.kubernetes.io/part-of: monitoring-stack
  managed-by: argocd
