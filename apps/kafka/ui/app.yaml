apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" # Deploy after Kafka cluster
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://provectus.github.io/kafka-ui-charts
    targetRevision: 0.7.6
    chart: kafka-ui
    helm:
      values: |
        image:
          registry: docker.io
          repository: provectuslabs/kafka-ui
          tag: v0.7.2

        yamlApplicationConfig:
          kafka:
            clusters:
              - name: kafka-cluster
                bootstrapServers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
          auth:
            type: disabled
          management:
            health:
              ldap:
                enabled: false

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web
          host: kafka-ui.duytran.app
          path: /
          pathType: Prefix

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
