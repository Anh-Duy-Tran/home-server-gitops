apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mirotalk
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Anh-Duy-Tran/home-server-gitops.git
    targetRevision: HEAD
    path: apps/mirotalk/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mirotalk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
